name: Release app

# Tag propio (app-vX.Y.Z), distinto del v* del mod: cada pieza se publica por
# separado y un tag no dispara el workflow de la otra.
on:
  push:
    tags: ["app-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z); leave empty to use the workspace version"
        required: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          WORKSPACE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            [[ -z "$VERSION" ]] && VERSION="$WORKSPACE_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#app-v}"
            if [[ "$VERSION" != "$WORKSPACE_VERSION" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version ($WORKSPACE_VERSION)"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build the Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Sin este ID, config.toml sigue siendo obligatorio para cualquiera que
      # instale la aplicación. Es un dato público (no un secreto), guardado como
      # variable del repositorio para no dejarlo en el código fuente.
      - name: Build the application
        env:
          FACTORIO_DRP_DEFAULT_APP_ID: ${{ vars.DISCORD_APPLICATION_ID }}
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.version.outputs.version }} installer\factorio-discord-rp.iss

      - name: Compute the SHA-256
        id: hash
        shell: bash
        run: |
          FILE="dist/FactorioDiscordRP-Setup-${{ needs.version.outputs.version }}.exe"
          sha256sum "$FILE" | awk '{print $1}' > "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*

  build-linux:
    name: Build the Linux binary
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Mismo ID incluido que en Windows (ver el comentario del job de arriba):
      # sin bandeja de sistema en Linux (ver app/Cargo.toml), así que este build
      # no necesita GTK/pkg-config, sólo el toolchain de Rust normal.
      - name: Build the application
        env:
          FACTORIO_DRP_DEFAULT_APP_ID: ${{ vars.DISCORD_APPLICATION_ID }}
        run: cargo build --release

      - name: Package the binary
        id: package
        shell: bash
        run: |
          NAME="factorio-discord-rp-linux-x86_64-${{ needs.version.outputs.version }}"
          mkdir -p "dist/$NAME"
          cp target/release/factorio-discord-rp "dist/$NAME/"
          cp app/config.example.toml "dist/$NAME/"
          cp README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -rf "dist/$NAME"
          sha256sum "dist/$NAME.tar.gz" | awk '{print $1}' > "dist/$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/*

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download the Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            dist/* \
            --title "App v${{ needs.version.outputs.version }}" \
            --generate-notes
