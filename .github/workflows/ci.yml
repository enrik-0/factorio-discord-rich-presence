name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  app-windows:
    name: App (Rust, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

  # Compila y prueba de verdad en Linux (no sólo `cargo check` cruzado): el
  # icono de bandeja es de Windows (ver app/Cargo.toml), así que este runner
  # no necesita GTK ni pkg-config, sólo el toolchain de Rust normal.
  app-linux:
    name: App (Rust, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

  mod:
    name: Mod (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      - name: Lua syntax
        run: |
          for file in mod/*.lua; do
            luac5.4 -p "$file"
          done

      - name: Luacheck
        run: luacheck mod --config .luacheckrc

      # Valida info.json, comprueba que el changelog cubre la versión y produce
      # el zip con la estructura exacta que exige el Mod Portal.
      - name: Package
        run: python3 scripts/package_mod.py

      - uses: actions/upload-artifact@v4
        with:
          name: mod-zip
          path: dist/*.zip
