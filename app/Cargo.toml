[package]
name = "factorio-discord-rp"
description = "Discord Rich Presence para Factorio 2.0+"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "factorio-discord-rp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
discord-rich-presence = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The registry, clipboard, console window, and tray icon (tray-icon/muda need
# GTK on Linux, which this project doesn't commit to having available) are
# Windows-specific; other platforms don't even need to resolve these crates.
# The "minimum viable" version on Linux runs in console mode (--console), with
# no tray.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.24.2"

# Single-instance locking on Unix is done with flock on a file.
[target.'cfg(unix)'.dependencies]
fd-lock = "*"

[dev-dependencies]
filetime = "0.2.29"
