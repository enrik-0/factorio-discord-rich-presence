[package]
name = "factorio-discord-rp"
description = "Discord Rich Presence para Factorio 2.1"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "factorio-discord-rp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
discord-rich-presence = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# El registro, el portapapeles, la ventana de consola y el icono de bandeja
# (tray-icon/muda necesitan GTK en Linux, que este proyecto no compromete a
# tener disponible) son de Windows; en otras plataformas no hace falta ni
# intentar resolver estos crates. La versión "mínimo viable" en Linux corre
# en modo consola (--console), sin bandeja.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.24.2"

# El bloqueo de instancia única en Unix se hace con flock sobre un fichero.
[target.'cfg(unix)'.dependencies]
fd-lock = "*"

[dev-dependencies]
filetime = "0.2.29"
