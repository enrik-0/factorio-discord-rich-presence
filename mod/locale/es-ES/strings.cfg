[mod-setting-name]
drp-interval-seconds=Intervalo de actualización (segundos)
drp-enabled=Publicar mi estado en Discord
drp-show-save=Nombre de la partida
drp-show-planet=Planeta
drp-show-overhaul=Modpack principal
drp-show-research=Investigación en curso
drp-show-tech-count=Contador de tecnologías
drp-show-evolution=Factor de evolución
drp-show-rockets=Cohetes lanzados
drp-show-mod-count=Número de mods
drp-show-mode=Un jugador / multijugador
drp-show-player-name=Mi nombre de jugador
drp-show-server=Dirección del servidor
drp-timer=Cronómetro

[mod-setting-description]
drp-interval-seconds=Cada cuánto se escribe el fichero de estado. Discord limita a una actualización cada 15 segundos, así que bajarlo no hace que el estado cambie antes.
drp-enabled=Interruptor maestro. Desactívalo para dejar de compartir sin quitar el mod.
drp-show-save=Línea 1. El nombre lo obtiene la aplicación del registro del juego.
drp-show-planet=Línea 1. Es tu posición física: mirar con vista remota no lo cambia.
drp-show-overhaul=Línea 1. El overhaul detectado, por ejemplo Krastorio2 o Space Age.
drp-show-research=Línea 2. Tecnología en curso y su porcentaje, en tu idioma.
drp-show-tech-count=Al pasar el ratón. Tecnologías completadas sobre el total, sin contar las infinitas.
drp-show-evolution=Al pasar el ratón. Evolución de los enemigos en tu superficie actual.
drp-show-rockets=Al pasar el ratón. Se oculta solo mientras no hayas lanzado ninguno.
drp-show-mod-count=Al pasar el ratón. Cuántos mods tienes activos.
drp-show-mode=Al pasar el ratón. Y en multijugador, cuántos jugadores hay conectados.
drp-show-player-name=Al pasar el ratón. Útil sobre todo en multijugador.
drp-show-server=Al pasar el ratón. Expone la dirección del servidor a quien vea tu perfil.
drp-timer=Qué cuenta el cronómetro de la tarjeta.

[string-mod-setting]
drp-timer-save=Tiempo jugado de la partida
drp-timer-session=Tiempo de esta sesión
drp-timer-none=Sin cronómetro

[drp]
debug-help=Imprime los datos que está publicando el mod, para contrastarlos con el árbol de tecnologías.
