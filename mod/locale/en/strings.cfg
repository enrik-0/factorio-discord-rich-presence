[mod-setting-description]
drp-interval-seconds=How often the state file is written. Discord limits the companion app to one update every 15 seconds, so lower values do not make the status update sooner.
drp-enabled=Master switch. Turn it off to stop sharing without removing the mod.
drp-show-save=Line 1. The companion app reads the name from the game log.
drp-show-planet=Line 1. Your physical location: remote view does not change it.
drp-show-overhaul=Line 1. The detected overhaul, such as Krastorio2 or Space Age.
drp-show-research=Line 2. The technology being researched and its progress, in your language.
drp-show-tech-count=On hover. Completed technologies out of the total, excluding infinite ones.
drp-show-evolution=On hover. Enemy evolution on your current surface.
drp-show-rockets=On hover. Hides itself while you have not launched any.
drp-show-trees=On hover. Trees felled or burned down, across every surface. Hides itself while it's zero.
drp-show-enemies=On hover. Biters, spitters, worms and spawners you have destroyed, across every surface. Hides itself while it's zero.
drp-show-deaths=On hover. How many times you have died. Hides itself while it's zero.
drp-show-pollution=On hover. Total pollution emitted on every surface, not just your force's — the game does not track it per force.
drp-show-afk=On hover. How long since your last action.
drp-show-mod-count=On hover. How many mods you have enabled.
drp-show-mode=On hover. And in multiplayer, how many players are connected.
drp-show-player-name=On hover. Mostly useful in multiplayer.
drp-show-server=On hover. Exposes the server address to anyone who sees your profile.
drp-timer=What the card's timer counts.

[string-mod-setting]
drp-timer-save=Total playtime of the save
drp-timer-session=This session
drp-timer-none=No timer

[drp]
debug-help=Prints the data this mod is publishing, to compare against the technology tree.
